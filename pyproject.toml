[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "incident-intelligence-system"
version = "0.4.0"
description = "Recuperación híbrida escalable con Pinecone Serverless y BM25."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Diego Chiang Meléndez" }]
dependencies = [
  "langchain-classic>=1.0,<2",
  "langchain-community>=0.4,<1",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "openai>=2.0,<3",
  "pinecone>=10.0,<11",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "rank-bm25>=0.2,<1",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
cloud-rag = "incident_intelligence.cli.cloud_rag:main"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_intelligence"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

